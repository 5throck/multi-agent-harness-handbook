name: Validate Handbook

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'

jobs:
  validate-handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08ea17e6bf # v2.0.1
      - run: bun run validate-handbook

  validate-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08ea17e6bf # v2.0.1
      - run: bun run validate-nav

  check-authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08ea17e6bf # v2.0.1
      - run: bun run check-authoring
