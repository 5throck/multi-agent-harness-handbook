name: Validate Handbook

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun run validate-handbook
      - run: bun run check-symmetry
      - run: bun run check-links
      - run: bun run check-labels
      - run: bun run check-authoring
      - run: bun run doctor
      - run: bun run check-a11y
      - run: bun run check-spell
      - run: bun run check-lint
      - run: bun run check-external-links
      - run: bun run check-search
      - run: bun run build-search-index
      - name: Verify search-data.js is up to date
        run: |
          if ! git diff --exit-code docs/assets/search-data.js; then
            echo "::error::search-data.js is out of sync with search-manifest.json. Run 'bun run build-search-index' and commit the result."
            exit 1
          fi
